name: Android
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android NDK
        run: sdkmanager 'ndk;28.0.13004108' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Cache pinned mobile core and corresponding source
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            libbox.aar
            .core-build/sing-box
            ~/go/pkg/mod
          key: moth-native-${{ runner.os }}-go1.27.2-ndk28-${{ hashFiles('scripts/build-libbox.sh', 'scripts/native/**') }}
      - name: Build official mobile core
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-libbox.sh
      - name: Check Go license notices (licenses/go-modules.txt)
        run: |
          bash scripts/go-licenses.sh .core-build/sing-box licenses/go-modules.txt
          if ! git diff --exit-code --stat licenses/go-modules.txt; then
            echo "::error file=licenses/go-modules.txt::Go license notices are out of date. Run scripts/build-libbox.sh (or MOTH_PREPARE_ONLY=1) and commit licenses/go-modules.txt."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Moth-native-core
          path: libbox.aar
      - name: Archive corresponding source and Go dependencies
        run: |
          mkdir -p artifacts
          tar --exclude='.git' -czf artifacts/sing-box-v1.12.25-source.tar.gz -C .core-build sing-box
          tar -czf artifacts/sing-box-go-dependencies.tar.gz -C "$(go env GOPATH)/pkg" mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Tests, APK and Android Lint
        env:
          MOTH_KEYSTORE_BASE64: ${{ secrets.MOTH_KEYSTORE_BASE64 }}
          MOTH_KEYSTORE_PASSWORD: ${{ secrets.MOTH_KEYSTORE_PASSWORD }}
          MOTH_KEYSTORE_FILE: ${{ runner.temp }}/moth-release.p12
        run: |
          chmod +x gradlew
          signing_flags=()
          suffix=""
          if [ -n "$MOTH_KEYSTORE_BASE64" ] && [ -n "$MOTH_KEYSTORE_PASSWORD" ]; then
            umask 077
            echo "$MOTH_KEYSTORE_BASE64" | base64 --decode > "$MOTH_KEYSTORE_FILE"
          else
            signing_flags=(-PunsignedValidation=true)
            suffix="-unsigned"
          fi
          unset MOTH_KEYSTORE_BASE64
          echo "::group::resources before build"; free -h; df -h /; echo "::endgroup::"
          ./gradlew :core:test :app:assembleRelease :app:lintRelease --no-daemon --stacktrace "${signing_flags[@]}"
          echo "::group::resources after build"; free -h; df -h /; echo "::endgroup::"
          version=$(jq -er '.elements[0].versionName | select(type == "string" and length > 0)' app/build/outputs/apk/release/output-metadata.json)
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "app/build/outputs/apk/release/app-$abi-release$suffix.apk" "artifacts/Moth-$version-$abi$suffix.apk"
          done
          cp libbox.aar artifacts/libbox-v1.12.25.aar
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt
      - name: Generated Xray configs pass xray run -test
        run: bash scripts/check-xray-configs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Moth-android
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-release.*

  e2e:
    # Emulator end-to-end test: real VPN against local sing-box servers on the runner (see scripts/e2e/).
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Moth-native-core
          path: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug and test APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :e2e-helper:assembleDebug --no-daemon
      - name: Start test servers on the host
        run: |
          sudo ip addr add 10.0.2.2/32 dev lo
          curl -fsSL -o sb.tgz https://github.com/SagerNet/sing-box/releases/download/v1.12.25/sing-box-1.12.25-linux-amd64.tar.gz
          tar xzf sb.tgz
          # Xray server for XHTTP (same release as the core in libbox).
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.10.17/Xray-linux-64.zip
          echo "ecdd54eccd24c4c21a8f00968e7dbf7f5996da92383d2321170b560dc4a95158  xray.zip" | sha256sum -c -
          unzip -oq xray.zip xray -d xray-bin
          nohup python3 scripts/e2e/server.py "$PWD/sing-box-1.12.25-linux-amd64/sing-box" "$PWD/xray-bin/xray" > e2e-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8081/health && break; sleep 1; done
          curl -fs --cacert scripts/e2e/ca.pem https://10.0.2.2:8443/sub > /dev/null
          curl -fs --cacert scripts/e2e/user-ca.pem https://10.0.2.2:8444/sub > /dev/null
          python3 -c "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(3); s.sendto(b'x', ('10.0.2.2', 9999)); print(s.recv(64))"
      - name: Run E2E tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb install -r -t app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb install -r -t e2e-helper/build/outputs/apk/debug/e2e-helper-debug.apk
            # User-installed CA (as Settings → Install certificate would store it); needs adb root (default system image).
            ./scripts/e2e/install-user-ca.sh scripts/e2e/user-ca.pem
            adb shell appops set org.mothvpn.android ACTIVATE_VPN allow
            ./scripts/e2e/app-log.sh enable
            adb logcat -c
            adb shell am instrument -w -r org.mothvpn.android.test/androidx.test.runner.AndroidJUnitRunner > e2e-result.txt 2>&1 || true
            adb logcat -d > e2e-logcat.txt 2>&1 || true
            ./scripts/e2e/app-log.sh pull
            adb pull /sdcard/Android/data/org.mothvpn.android/cache/e2e-window.xml . > /dev/null 2>&1 || true
            adb pull /sdcard/Android/data/org.mothvpn.android/cache/stats.png . > /dev/null 2>&1 || true
            adb pull /sdcard/Android/data/org.mothvpn.android/cache/settings.png . > /dev/null 2>&1 || true
            adb pull /sdcard/Android/data/org.mothvpn.android/cache/dev.png . > /dev/null 2>&1 || true
            adb pull /sdcard/Android/data/org.mothvpn.android/cache/ e2e-cache > /dev/null 2>&1 || true
            cat e2e-result.txt
            grep -qE "^OK \([0-9]+ tests\)" e2e-result.txt && ! grep -q "FAILURES" e2e-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            e2e-result.txt
            e2e-logcat.txt
            e2e-app-log.txt
            e2e-window.xml
            e2e-server.log
            e2e-cache/
            stats.png
            settings.png
            dev.png
