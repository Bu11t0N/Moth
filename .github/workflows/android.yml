name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android NDK
        run: sdkmanager 'ndk;28.0.13004108' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Cache pinned mobile core and corresponding source
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            libbox.aar
            .core-build/sing-box
            ~/go/pkg/mod
          key: moth-native-${{ runner.os }}-go1.24.3-ndk28-${{ hashFiles('scripts/build-libbox.sh', 'scripts/native/**') }}
      - name: Build official mobile core
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-libbox.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Moth-native-core
          path: libbox.aar
      - name: Archive corresponding source and Go dependencies
        run: |
          mkdir -p artifacts
          tar --exclude='.git' -czf artifacts/sing-box-v1.11.15-source.tar.gz -C .core-build sing-box
          tar -czf artifacts/sing-box-go-dependencies.tar.gz -C "$(go env GOPATH)/pkg" mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Tests, APK and Android Lint
        env:
          MOTH_KEYSTORE_BASE64: ${{ secrets.MOTH_KEYSTORE_BASE64 }}
          MOTH_KEYSTORE_PASSWORD: ${{ secrets.MOTH_KEYSTORE_PASSWORD }}
          MOTH_KEYSTORE_FILE: ${{ runner.temp }}/moth-release.p12
        run: |
          chmod +x gradlew
          signing_flags=()
          suffix=""
          if [ -n "$MOTH_KEYSTORE_BASE64" ] && [ -n "$MOTH_KEYSTORE_PASSWORD" ]; then
            umask 077
            echo "$MOTH_KEYSTORE_BASE64" | base64 --decode > "$MOTH_KEYSTORE_FILE"
          else
            signing_flags=(-PunsignedValidation=true)
            suffix="-unsigned"
          fi
          unset MOTH_KEYSTORE_BASE64
          ./gradlew :core:test :app:assembleRelease :app:lintRelease --no-daemon "${signing_flags[@]}"
          version=$(jq -er '.elements[0].versionName | select(type == "string" and length > 0)' app/build/outputs/apk/release/output-metadata.json)
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "app/build/outputs/apk/release/app-$abi-release$suffix.apk" "artifacts/Moth-$version-$abi$suffix.apk"
          done
          cp libbox.aar artifacts/libbox-v1.11.15.aar
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Moth-android
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-release.*
