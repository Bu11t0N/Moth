name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android NDK
        run: sdkmanager 'ndk;28.0.13004108' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build official mobile core
        run: bash scripts/build-libbox.sh
      - name: Archive corresponding source and Go dependencies
        run: |
          mkdir -p artifacts
          tar --exclude='.git' -czf artifacts/sing-box-v1.11.15-source.tar.gz -C .core-build sing-box
          tar -czf artifacts/sing-box-go-dependencies.tar.gz -C "$(go env GOPATH)/pkg" mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Tests, APK and Android Lint
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleDebug :app:lintDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Moth-0.1.0-alpha.1.apk
          cp libbox.aar artifacts/libbox-v1.11.15.aar
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Moth-android
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.*
